<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>巴西45号白糖进口中国CIF价格评估系统</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>巴西45号白糖进口中国CIF价格评估系统</h1>
    <p class="subtitle">基于CEPEA、ICE数据的实时价格评估（FOB加权不含郑州，郑州仅用于到岸对比）</p>
    <div id="last-update">最后更新：--</div>
  </header>

  <main class="main-grid">
    <!-- 左侧：参数设置 -->
    <section class="panel card">
      <h2>参数设置</h2>

      <div class="field">
        <label>FOB Santos价格 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="fobSlider" min="400" max="600" value="490" />
          <input type="number" id="fobInput" min="400" max="600" value="490" />
        </div>
      </div>

      <div class="field">
        <label>ICE No.11期货价格 (美分/磅)</label>
        <div class="input-row">
          <input type="range" id="iceSlider" min="12" max="25" step="0.1" value="16.3" />
          <input type="number" id="iceInput" min="12" max="25" step="0.1" value="16.3" />
        </div>
      </div>

      <div class="field">
        <label>CEPEA价格 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="cepeaSlider" min="400" max="700" value="535" />
          <input type="number" id="cepeaInput" min="400" max="700" value="535" />
        </div>
      </div>

      <div class="field">
        <label>海运费 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="freightSlider" min="40" max="100" value="65" />
          <input type="number" id="freightInput" min="40" max="100" value="65" />
        </div>
      </div>

      <div class="field">
        <label>汇率 (USD→CNY)</label>
        <div class="input-row">
          <input type="range" id="exchangeSlider" min="6.5" max="8" step="0.01" value="7.2" />
          <input type="number" id="exchangeInput" min="6.5" max="8" step="0.01" value="7.2" />
        </div>
      </div>

      <div class="field">
        <label>关税率 (%)</label>
        <select id="tariffSelect">
          <option value="15">配额内 15%</option>
          <option value="50">配额外 50%</option>
        </select>
      </div>

      <div class="field">
        <label>保险费 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="insuranceSlider" min="3" max="10" value="5" />
          <input type="number" id="insuranceInput" min="3" max="10" value="5" />
        </div>
      </div>

      <div class="field">
        <label>其他费用 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="otherSlider" min="5" max="50" value="10" />
          <input type="number" id="otherInput" min="5" max="50" value="10" />
        </div>
      </div>

      <div class="field">
        <label>港口杂费 (美元/吨)</label>
        <div class="input-row">
          <input type="range" id="portSlider" min="20" max="50" value="35" />
          <input type="number" id="portInput" min="20" max="50" value="35" />
        </div>
      </div>
    </section>

    <!-- 右侧：计算结果与图表 -->
    <section class="panel card">
      <h2>计算结果</h2>

      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-title">加权平均FOB价格</div>
          <div class="kpi-value" id="fobWeighted">$-</div>
        </div>
        <div class="kpi">
          <div class="kpi-title">CIF价格</div>
          <div class="kpi-value" id="cifPrice">$-</div>
        </div>
        <div class="kpi">
          <div class="kpi-title">最终进口成本（美元）</div>
          <div class="kpi-value" id="totalUsd">$-</div>
        </div>
        <div class="kpi">
          <div class="kpi-title">最终进口成本（人民币）</div>
          <div class="kpi-value" id="totalCny">¥-</div>
        </div>
        <div class="kpi">
          <div class="kpi-title">郑州期货价格</div>
          <div class="kpi-value">¥5672/吨</div>
        </div>
        <div class="kpi">
          <div class="kpi-title">价格差异</div>
          <div class="kpi-value" id="diffPct">-</div>
        </div>
      </div>

      <div id="suggestion" class="suggestion">-</div>

      <h3 class="section-title">成本构成分析</h3>
      <canvas id="costChart" height="260"></canvas>

      <h3 class="section-title">成本明细</h3>
      <div id="costDetails" class="cost-details-card"></div>
    </section>
  </main>

  <!-- 先加载Chart.js，再加载业务逻辑 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
